name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (Node 24.x)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        # No current dependency uses lifecycle scripts; keep it that way in CI.
        run: npm ci --ignore-scripts

      - name: Run static checks
        # Node-version-independent checks (model, generated views, lint,
        # formatting) run once here instead of once per matrix leg.
        run: npm run check:static

      - name: Run tests with coverage
        # The single Node 24 test execution; also produces the coverage report.
        run: npm run test:coverage

      - name: Verify package contents
        run: npm run pack:dry-run

  test:
    name: Node ${{ matrix.node-version }} tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # No current dependency uses lifecycle scripts; keep it that way in CI.
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
