name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Dormant switch — remains a no-op until the go-public runbook sets this.
    if: ${{ vars.RELEASE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Assert bundled npm supports OIDC trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 24 bundles npm >= 11.5.1.
        # Guard instead of upgrading so no unpinned third-party code runs here.
        run: |
          version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} < 11.5.1; cannot publish via OIDC`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} >= 11.5.1`);
          ' "$version"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm with provenance
        # OIDC trusted publishing: no NODE_AUTH_TOKEN. --provenance is required
        # explicitly; id-token:write alone does not generate provenance.
        run: npm publish --provenance --access public
